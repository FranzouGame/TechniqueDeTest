[tool.ruff]
extend-exclude = [".tmp"]

[tool.ruff.lint]
select = [
    "D",
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["perf: mesures de performance et de mémoire"]

[tool.coverage.run]
source = ["triangulator"]

[tool.coverage.report]
show_missing = true
